name: Go test
on: [push]
jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: 1.23
      - name: test
        run: make test
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
